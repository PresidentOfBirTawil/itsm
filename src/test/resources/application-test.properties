# Tests run against a throw-away in-memory database, never against ./data/itsm.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
# Tests call the SLA check themselves, with a time they choose, so the background job is off.
itsm.sla.monitor.enabled=false
