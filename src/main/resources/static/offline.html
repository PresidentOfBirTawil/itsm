<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <title>Offline · Quell</title>
    <script src="/js/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/webjars/fontsource-variable__inter/index.css">
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="d-flex flex-column min-vh-100">
<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="text-center offline-panel">
        <img src="/img/logo.svg" width="56" height="56" alt="" class="mb-4">
        <h1 class="h3 mb-2">You're offline</h1>
        <p class="text-body-secondary mb-4">
            Quell can't reach the server right now. Check your internet connection or VPN;
            your work is safe on the server and nothing was lost.
        </p>
        <a class="btn btn-primary" href="/dashboard"><i class="bi bi-arrow-clockwise me-1"></i>Try again</a>
        <p class="small text-body-secondary mt-4 mb-0">
            Something urgent and Quell is down? Call the service desk.
        </p>
    </div>
</main>
</body>
</html>
