# Server installation (for example with docker-compose.yml): PostgreSQL, behind a proxy that does HTTPS.
# Every value can be set with an environment variable, e.g. DATABASE_URL or APP_PUBLIC_URL.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quell}
spring.datasource.username=${DATABASE_USER:quell}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:20}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.thymeleaf.cache=true

# Behind a reverse proxy or load balancer: trust its X-Forwarded-* headers (HTTPS, host).
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
server.compression.enabled=true

# The address people use, for links in Slack/Teams messages and webhooks.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.demo-mode=${APP_DEMO_MODE:true}
logging.level.org.hibernate.orm.jdbc.warn=error
