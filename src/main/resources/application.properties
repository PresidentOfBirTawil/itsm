spring.application.name=quell

# The product: its name (shown everywhere), tagline and version. Rename or white-label here.
app.brand.name=Quell
app.brand.tagline=Intelligent IT service management
app.version=@project.version@
# Where the installers can be downloaded: the latest release, built by .github/workflows/build.yml.
app.download-url=https://github.com/PresidentOfBirTawil/itsm/releases/latest

# Demo mode: the demo accounts exist and the sign-in page offers one-click demo sign-in.
# Switch off for a real organisation.
app.demo-mode=true

# When no profile is chosen the app runs with the "dev" profile,
# so a plain `./mvnw spring-boot:run` is a development run.
spring.profiles.default=dev

# H2 in file mode: the database is the file ./data/itsm.mv.db and survives restarts.
spring.datasource.url=jdbc:h2:file:./data/itsm
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates missing tables and columns from the entity classes at startup.
spring.jpa.hibernate.ddl-auto=update
# Keep the database session open while a page is rendered, so templates can
# follow links between objects (for example incident -> reporter -> name).
spring.jpa.open-in-view=true

# The H2 web console is off unless a profile switches it on (see application-dev.properties).
spring.h2.console.enabled=false

# The SLA check: a background job that looks at every open incident once a minute.
itsm.sla.monitor.enabled=true
itsm.sla.monitor.interval-ms=60000

# Attachments: at most 5 MB per file (checked again in AttachmentService). A larger
# upload is answered with a message; Tomcat reads up to 50 MB of it to be able to answer.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=50MB
