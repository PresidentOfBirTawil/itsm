spring.application.name=itsm

# When no profile is chosen the app runs with the "dev" profile,
# so a plain `./mvnw spring-boot:run` is a development run.
spring.profiles.default=dev

# H2 in file mode: the database is the file ./data/itsm.mv.db and survives restarts.
spring.datasource.url=jdbc:h2:file:./data/itsm
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates missing tables and columns from the entity classes at startup.
spring.jpa.hibernate.ddl-auto=update
# Keep the database session open while a page is rendered, so templates can
# follow links between objects (for example incident -> reporter -> name).
spring.jpa.open-in-view=true

# The H2 web console is off unless a profile switches it on (see application-dev.properties).
spring.h2.console.enabled=false
