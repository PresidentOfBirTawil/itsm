# The installed desktop application (see com.quell.desktop.DesktopLauncher).
# app.data-dir and app.port are set by the launcher before the server starts.

# The data lives in the user's application-data folder, so it survives updates and reinstalls.
spring.datasource.url=jdbc:h2:file:${app.data-dir}/quell
logging.file.name=${app.data-dir}/quell.log

# Only this computer can reach it. To let others on the network use it, set server.address=0.0.0.0.
server.port=${app.port:8080}
server.address=127.0.0.1
