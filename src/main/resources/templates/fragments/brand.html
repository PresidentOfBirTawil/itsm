<!DOCTYPE html>
<!--/*
  The Quell mark: a ring whose tail is a flat line, the calm after an incident.
  Drawn inline in the current text colour, so it is black on light and white on dark.
  size - the height in pixels; the width follows (24 x 22 units).
*/-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<svg th:fragment="mark(size)" class="brand-mark" viewBox="0 0 24 22" aria-hidden="true" focusable="false"
     th:attr="width=${size * 24 / 22},height=${size}"><circle cx="11" cy="11" r="9.25" fill="none" stroke="currentColor" stroke-width="3.5"/><rect x="11" y="18.5" width="13" height="3.5" fill="currentColor"/></svg>
</body>
</html>
