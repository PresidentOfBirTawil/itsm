<!DOCTYPE html>
<!-- Small building blocks reused across pages: stat cards, badges and the incident table. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- A number with a label and an icon. -->
<div th:fragment="stat(label, value, icon)" class="card stat-card h-100">
    <div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon"><i class="bi" th:classappend="${icon}"></i></div>
        <div>
            <div class="stat-value" th:text="${value}">0</div>
            <div class="text-body-secondary small" th:text="${label}">Label</div>
        </div>
    </div>
</div>

<!-- Priority, for example "P1 · Critical". Shows a dash when no priority has been set yet. -->
<th:block th:fragment="priorityBadge(priority)">
    <span th:if="${priority != null}" class="badge"
          th:classappend="${priority.name() == 'P1'} ? 'text-bg-danger' : (${priority.name() == 'P2'} ? 'text-bg-warning' : (${priority.name() == 'P3'} ? 'text-bg-info' : 'text-bg-secondary'))"
          th:text="|${priority.name()} · ${priority.label}|">P1 · Critical</span>
    <span th:if="${priority == null}">—</span>
</th:block>

<!-- Service criticality: 3 = high, 2 = medium, 1 = low. -->
<span th:fragment="criticalityBadge(level)" class="badge"
      th:classappend="${level == 3} ? 'text-bg-danger' : (${level == 2} ? 'text-bg-warning' : 'text-bg-secondary')"
      th:text="${level == 3} ? '3 · High' : (${level == 2} ? '2 · Medium' : '1 · Low')">3 · High</span>

<!-- Incident status. -->
<span th:fragment="statusBadge(status)" class="badge"
      th:classappend="${status.name() == 'AWAITING_INFO'} ? 'text-bg-warning' : (${status.open} ? 'text-bg-primary' : (${status.name() == 'CLOSED'} ? 'text-bg-secondary' : 'text-bg-success'))"
      th:text="${status.label}">New</span>

<!-- Where the incident stands against its SLA. Shows a dash when it has no deadlines yet. -->
<th:block th:fragment="slaBadge(sla)">
    <span th:if="${sla != null}" class="badge"
          th:classappend="${sla.name() == 'BREACHED'} ? 'text-bg-danger' : (${sla.name() == 'AT_RISK'} ? 'text-bg-warning' : (${sla.name() == 'PAUSED'} ? 'text-bg-secondary' : (${sla.name() == 'MET'} ? 'text-bg-success' : 'bg-success-subtle text-success-emphasis border border-success-subtle')))"
          th:text="${sla.label}">On track</span>
    <span th:if="${sla == null}">—</span>
</th:block>

<!-- A length of time given in minutes, written the way people say it: "5 min", "2 h", "1 h 30 min". -->
<span th:fragment="duration(minutes)"
      th:text="${minutes < 60} ? (${minutes} + ' min') : (${minutes % 60 == 0} ? (${minutes / 60} + ' h') : (${minutes / 60} + ' h ' + ${minutes % 60} + ' min'))">5 min</span>

<!--
  A table of incidents, or a friendly message when there are none.

  columns  - which optional columns to show, as one string. Any of:
             service, category, priority, status, sla, reporter, assignee, reported, due
  basePath - where this role's incident pages live, e.g. '/employee/incidents'.
             Each code links to basePath + '/' + code.
-->
<div th:fragment="incidentTable(incidents, emptyMessage, columns, basePath)">
    <div th:if="${#lists.isEmpty(incidents)}" class="text-center text-body-secondary py-5">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        <span th:text="${emptyMessage}">No incidents.</span>
    </div>
    <div th:unless="${#lists.isEmpty(incidents)}" class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th scope="col">Code</th>
                <th scope="col">Title</th>
                <th scope="col" th:if="${#strings.contains(columns, 'service')}">Service</th>
                <th scope="col" th:if="${#strings.contains(columns, 'category')}">Category</th>
                <th scope="col" th:if="${#strings.contains(columns, 'priority')}">Priority</th>
                <th scope="col" th:if="${#strings.contains(columns, 'status')}">Status</th>
                <th scope="col" th:if="${#strings.contains(columns, 'sla')}">SLA</th>
                <th scope="col" th:if="${#strings.contains(columns, 'reporter')}">Reporter</th>
                <th scope="col" th:if="${#strings.contains(columns, 'assignee')}">Assignee</th>
                <th scope="col" th:if="${#strings.contains(columns, 'reported')}">Reported</th>
                <th scope="col" th:if="${#strings.contains(columns, 'due')}">Resolve by</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="incident : ${incidents}">
                <td class="fw-semibold text-nowrap">
                    <a th:href="@{|${basePath}/${incident.code}|}" th:text="${incident.code}">INC-0001</a>
                </td>
                <td th:text="${incident.title}">Title</td>
                <td th:if="${#strings.contains(columns, 'service')}" th:text="${incident.service.name}">Service</td>
                <td th:if="${#strings.contains(columns, 'category')}"
                    th:text="${incident.category != null} ? ${incident.category.name} : '—'">Category</td>
                <td th:if="${#strings.contains(columns, 'priority')}">
                    <th:block th:replace="~{fragments/ui :: priorityBadge(${incident.priority})}"></th:block>
                </td>
                <td th:if="${#strings.contains(columns, 'status')}">
                    <span th:replace="~{fragments/ui :: statusBadge(${incident.status})}"></span>
                </td>
                <td th:if="${#strings.contains(columns, 'sla')}">
                    <th:block th:replace="~{fragments/ui :: slaBadge(${incident.slaStatus})}"></th:block>
                </td>
                <td th:if="${#strings.contains(columns, 'reporter')}" th:text="${incident.reporter.name}">Reporter</td>
                <td th:if="${#strings.contains(columns, 'assignee')}"
                    th:text="${incident.assignee != null} ? ${incident.assignee.name} : '—'">Assignee</td>
                <td th:if="${#strings.contains(columns, 'reported')}" class="text-nowrap"
                    th:text="${#temporals.format(incident.createdAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 10:05</td>
                <td th:if="${#strings.contains(columns, 'due')}" class="text-nowrap">
                    <th:block th:replace="~{fragments/ui :: deadline(${incident.resolutionDue}, ${incident.overdue})}"></th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- A deadline. Shown in red with an "overdue" badge once it has passed and the work is not done. -->
<th:block th:fragment="deadline(when, overdue)">
    <span th:if="${when != null}" th:classappend="${overdue} ? 'text-danger fw-semibold'"
          th:text="${#temporals.format(when, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 10:35</span>
    <span th:if="${when != null and overdue}" class="badge text-bg-danger ms-1">overdue</span>
    <span th:if="${when == null}">—</span>
</th:block>

</body>
</html>
