<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('My queue', 'incidents', ~{::main})}">
<body>
<main>
    <div class="mb-4">
        <h1 class="h3 mb-1">My queue</h1>
        <p class="text-body-secondary mb-0">
            The open incidents assigned to you. The one that must be resolved soonest is at the top.
        </p>
    </div>

    <div class="card mb-4">
        <div class="card-header">Open</div>
        <div class="card-body p-0">
            <div th:replace="~{fragments/ui :: incidentTable(${queue}, 'Your queue is empty.', 'service,category,priority,status,reporter,due', '/technician/incidents')}"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Resolved, verified and closed</div>
        <div class="card-body p-0">
            <div th:replace="~{fragments/ui :: incidentTable(${finished}, 'Nothing here yet.', 'service,category,priority,status,reporter', '/technician/incidents')}"></div>
        </div>
    </div>
</main>
</body>
</html>
