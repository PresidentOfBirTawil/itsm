<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Employee dashboard', 'dashboard', ~{::main})}">
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1">Welcome, <span th:text="${employee.name}">Employee</span></h1>
            <p class="text-body-secondary mb-0">Employee workspace · report IT incidents and follow their progress.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/employee/incidents/new}">
            <i class="bi bi-plus-circle me-1"></i>Report an incident</a>
    </div>

    <!-- Incidents where the next step is the employee's -->
    <div class="card border border-primary-subtle mb-4" th:unless="${#lists.isEmpty(waitingForMe)}">
        <div class="card-header"><i class="bi bi-hand-index me-1"></i>Waiting for you</div>
        <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action d-flex flex-wrap justify-content-between gap-2"
               th:each="incident : ${waitingForMe}" th:href="@{|/employee/incidents/${incident.code}|}">
                <span><span class="fw-semibold" th:text="${incident.code}">INC-0001</span>
                    <span th:text="${incident.title}">Title</span></span>
                <span class="text-body-secondary"
                      th:text="${incident.status.name() == 'RESOLVED'} ? 'Resolved: please confirm that it is fixed' : 'The technician has asked you a question'">What to do</span>
            </a>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-4">
            <div th:replace="~{fragments/ui :: stat('Incidents reported', ${incidents.size()}, 'bi-card-list')}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fragments/ui :: stat('Still open', ${openCount}, 'bi-hourglass-split')}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fragments/ui :: stat('Resolved or closed', ${doneCount}, 'bi-check2-circle')}"></div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header">My incidents</div>
                <div class="card-body p-0">
                    <div th:replace="~{fragments/ui :: incidentTable(${incidents}, 'You have not reported any incidents yet.', 'service,priority,status,sla,reported', '/employee/incidents')}"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">IT services</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="service : ${services}">
                        <span th:text="${service.name}">Service</span>
                        <span th:replace="~{fragments/ui :: criticalityBadge(${service.criticality})}"></span>
                    </li>
                </ul>
                <div class="card-footer bg-transparent small text-body-secondary">
                    The badge shows how critical each service is to the business.
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
