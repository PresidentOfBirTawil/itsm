<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Integrations', 'webhooks', ~{::main})}">
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-4">
        <div>
            <h1 class="page-title mb-1">Integrations</h1>
            <p class="text-body-secondary mb-0">
                Tell Slack, Microsoft Teams or any other app about incidents the moment they happen (webhooks).
                For the other direction, use the <a th:href="@{/api/docs}" target="_blank" rel="noopener">REST API</a>.
            </p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/webhooks/new}"><i class="bi bi-plus-circle me-1"></i>Add webhook</a>
    </div>

    <div class="row g-3 mb-4" th:if="${#lists.isEmpty(webhooks)}">
        <div class="col-md-4" th:each="example : ${ {'Slack', 'Microsoft Teams', 'Any app'} }">
            <div class="card h-100">
                <div class="card-body">
                    <i class="bi fs-3 d-block mb-2"
                       th:classappend="${example == 'Slack'} ? 'bi-slack' : (${example == 'Any app'} ? 'bi-braces' : 'bi-microsoft-teams')"></i>
                    <div class="fw-semibold" th:text="${example}">Slack</div>
                    <div class="small text-body-secondary"
                         th:text="${example == 'Any app'} ? 'Signed JSON for your own tools, e.g. an on-call pager or a dashboard.' : |Post new P1s, breaches and fixes into a ${example} channel.|">Text</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4" th:unless="${#lists.isEmpty(webhooks)}">
        <div class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th scope="col">Webhook</th>
                    <th scope="col">Sends to</th>
                    <th scope="col">Events</th>
                    <th scope="col">State</th>
                    <th scope="col" class="text-end">Change</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="webhook : ${webhooks}">
                    <td>
                        <div class="fw-semibold"><i class="bi me-1" th:classappend="${webhook.kind.icon}"></i><span th:text="${webhook.name}">Ops</span></div>
                        <div class="small text-body-secondary" th:text="${webhook.kind.label}">Slack</div>
                    </td>
                    <td><code class="small" th:text="${webhook.maskedUrl}">https://hooks.slack.com/…</code></td>
                    <td class="small">
                        <span class="badge text-bg-light border me-1 mb-1" th:each="event : ${webhook.events}" th:text="${event.label}">Reported</span>
                        <span class="badge text-bg-warning" th:if="${webhook.majorOnly}">P1 and P2 only</span>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${webhook.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${webhook.enabled} ? 'On' : 'Off'">On</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{|/admin/webhooks/${webhook.id}/edit|}">Open</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{admin/fragments-webhooks :: deliveryLog(${deliveries}, true)}"></div>
</main>
</body>
</html>
