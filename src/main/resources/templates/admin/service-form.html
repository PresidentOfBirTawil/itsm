<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${heading}, 'services', ~{::main})}">
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h1 class="h3 mb-4" th:text="${heading}">Add an IT service</h1>
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{${action}}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:errorclass="is-invalid" maxlength="100" autofocus>
                            <div class="invalid-feedback" th:errors="*{name}">Name error</div>
                        </div>
                        <div class="mb-4">
                            <label for="criticality" class="form-label">Criticality</label>
                            <select class="form-select" id="criticality" th:field="*{criticality}" th:errorclass="is-invalid">
                                <option value="">Choose…</option>
                                <option value="3">3 · High: the business stops without it</option>
                                <option value="2">2 · Medium: work is harder without it</option>
                                <option value="1">1 · Low: an inconvenience</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{criticality}">Criticality error</div>
                            <div class="form-text">Changing this affects incidents reported from now on, not existing ones.</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/services}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
