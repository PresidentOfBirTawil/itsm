<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Users', 'users', ~{::main})}">
<body>
<main>
    <div class="mb-4">
        <h1 class="h3 mb-1">Users</h1>
        <p class="text-body-secondary mb-0">Everyone who can sign in, grouped by role.</p>
    </div>

    <div class="card mb-4">
        <div class="card-header">Administrators <span class="badge text-bg-light border ms-1" th:text="${administrators.size()}">1</span></div>
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="administrator : ${administrators}">
                    <td th:text="${administrator.name}">Name</td>
                    <td th:text="${administrator.email}">Email</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Technicians <span class="badge text-bg-light border ms-1" th:text="${technicians.size()}">4</span></div>
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Skills</th>
                    <th scope="col" class="text-end">Max workload</th>
                    <th scope="col">Availability</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="technician : ${technicians}">
                    <td class="text-nowrap" th:text="${technician.name}">Name</td>
                    <td th:text="${technician.email}">Email</td>
                    <td>
                        <span class="badge text-bg-light border me-1" th:each="skill : ${technician.skills}"
                              th:text="${skill.name}">Skill</span>
                    </td>
                    <td class="text-end" th:text="${technician.maxWorkload}">5</td>
                    <td>
                        <span class="badge"
                              th:classappend="${technician.available} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${technician.available} ? 'Available' : 'Not available'">Available</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Employees <span class="badge text-bg-light border ms-1" th:text="${employees.size()}">4</span></div>
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.name}">Name</td>
                    <td th:text="${employee.email}">Email</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
