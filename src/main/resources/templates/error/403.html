<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Access denied', 'none', ~{::main})}">
<body>
<main>
    <div class="text-center py-5">
        <div class="error-code">403</div>
        <h1 class="h3 mt-3">You do not have access to this page</h1>
        <p class="text-body-secondary" th:text="${reason} ?: 'Your account\'s role is not allowed to open it.'">Your account's role is not allowed to open it.</p>
        <a class="btn btn-primary" th:href="@{/dashboard}">Back to my dashboard</a>
    </div>
</main>
</body>
</html>
