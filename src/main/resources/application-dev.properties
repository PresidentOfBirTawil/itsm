# Development profile (the default).

# H2 web console at http://localhost:8080/h2-console (sign in to the app as the administrator first).
#   JDBC URL: jdbc:h2:file:./data/itsm   User: sa   Password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pick up template changes without restarting.
spring.thymeleaf.cache=false
