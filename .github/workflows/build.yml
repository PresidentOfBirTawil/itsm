# On every push: run all the tests, build the installers for Windows, Mac and Linux
# on GitHub's machines, and publish them as the "latest" release. The download links
# therefore never change:
#   https://github.com/<owner>/<repo>/releases/latest/download/Quell-Setup-Windows.exe
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run all tests
        run: ./mvnw -B verify

  package:
    name: Installer for ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Mac
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install the WiX Toolset (makes the Windows setup wizard)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Install fakeroot (makes the Linux package)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot
      - name: Build the installer
        shell: bash
        run: packaging/package.sh installer
      - name: Build the portable version
        shell: bash
        run: SKIP_BUILD=true packaging/package.sh portable
      - uses: actions/upload-artifact@v4
        with:
          name: Quell-${{ matrix.name }}
          path: target/release/*
          if-no-files-found: error

  release:
    name: Publish the downloads
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Replace the "latest" release with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s#{{GUIDE}}#https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/INSTALL.md#" \
            packaging/release-notes.md > notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest downloads/* \
            --target "$GITHUB_SHA" \
            --title "Quell (latest version)" \
            --notes-file notes.md \
            --latest
