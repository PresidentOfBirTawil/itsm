# Quell with PostgreSQL in two containers:
#   docker compose up --build
# then open http://localhost:8080. Data is kept in the "quell-db" volume.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: quell
      POSTGRES_USER: quell
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - quell-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quell -d quell"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/quell
      DATABASE_USER: quell
      DATABASE_PASSWORD: ${DB_PASSWORD:-change-me}
      APP_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      APP_DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "8080:8080"

volumes:
  quell-db:
